[project]
name = "undiscovered-worlds-tools"
version = "0"
description = "Python tooling of Undiscovered Worlds: evaluation, reports, reference preparation and the script tests."
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.2",
    "pillow==12.3.0",
    "rasterio==1.5.1",
    "fiona==1.10.1",
    "netcdf4==1.7.4",
    "cmocean==4.0.3",
    "matplotlib==3.11.1",
    "pyhdf==0.11.7",
    "openpyxl==3.1.5",
    "geopandas==1.1.4",
    "pyshtools==4.14.1",
    "pandas",
    "shapely",
    "xarray",
    "scipy",
    "pyamg",
    "requests",
    "filelock",
    "cdsapi>=0.7.7",
    "copernicusmarine>=2.4",
    "earthaccess",
    "icechunk",
    "pygplates==1.0.0",
]

[tool.uv]
# A tooling project, not a package: scripts put scripts/ on sys.path to import uwtools.
package = false
