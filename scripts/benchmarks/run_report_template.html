<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@TITLE@@</title>
<!-- standard-report-pending -->
<style>
:root{color-scheme:dark}body{font:15px/1.5 system-ui;margin:24px;background:#101923;color:#e9f0f5}h1{font-size:25px;font-weight:600;margin-bottom:4px}h2{font-size:19px;font-weight:600;margin-top:28px}a{color:#92cfff}
select{padding:7px;border:1px solid #516172;border-radius:4px;background:#1b2938;color:#fff;margin:4px 16px 4px 4px}label{display:inline-block}
table{border-collapse:collapse;font-variant-numeric:tabular-nums}td{padding:4px 14px 4px 0;vertical-align:top;border-bottom:1px solid #263544}td:first-child{color:#adbfce}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;margin-top:12px}
figure{margin:0}figcaption{color:#adbfce;margin-bottom:6px}img{width:100%;height:auto;display:block;background:#000;image-rendering:pixelated}
.missing{padding:40px;border:1px dashed #6d7b88;color:#aab6c1}.note{color:#aebfcf;font-size:13px;max-width:1100px}
</style>
<h1>@@TITLE@@</h1>
<p id="links"></p>
<table id="facts"></table>
<h2>Maps</h2>
<div><label>Map <select id="map"></select></label><label>Projection <select id="projection"></select></label></div>
<div class="panels" id="panels"></div>
<p class="note" id="map-note"></p>
<section id="animation-section"><h2>Animations</h2>
<div><label>Animation <select id="animation"></select></label></div><div class="panels" id="animation-panel"></div></section>
<script id="report-data" type="application/json">@@DATA@@</script>
<script>
const data=JSON.parse(document.getElementById('report-data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('links').innerHTML=data.links.map(([label,href])=>`<a href="${esc(href)}">${esc(label)}</a>`).join(' · ');
$('facts').innerHTML=data.facts.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
const fill=(select,entries)=>{select.innerHTML=entries.map(([value,label])=>`<option value="${esc(value)}">${esc(label)}</option>`).join('')};
fill($('map'),data.maps.map((m,i)=>[i,m.title]));
fill($('projection'),Object.entries(data.projections));
const params=new URLSearchParams(location.search);
if(params.has('map')){const i=data.maps.findIndex(m=>m.title===params.get('map'));if(i>=0)$('map').value=i}
if(params.has('projection')&&data.projections[params.get('projection')])$('projection').value=params.get('projection');
function panel(title,href){return `<figure><figcaption>${esc(title)}</figcaption>${href?`<img loading="lazy" src="${esc(href)}" alt="${esc(title)}">`:'<div class="missing">Not available for this run.</div>'}</figure>`}
function draw(){
  const m=data.maps[+$('map').value];if(!m){$('panels').innerHTML='<div class="missing">No maps exported.</div>';return}
  const p=$('projection').value,views=m.views[p]||{};
  let html=panel(`Run ${data.run} · ${m.title}`,views.run);
  if(data.compare_run!==null)html+=panel(`Run ${data.compare_run} · ${m.title}`,views.compare);
  $('panels').innerHTML=html;
  $('map-note').textContent=data.map_note+(p==='equirectangular'?'':' Projected views resample the exported map by nearest cell; transparent areas lie outside the globe.');
}
$('map').onchange=draw;$('projection').onchange=draw;draw();
if(!data.animations.length)$('animation-section').hidden=true;else{
  fill($('animation'),data.animations.map((a,i)=>[i,a.title]));
  const show=()=>{const a=data.animations[+$('animation').value];$('animation-panel').innerHTML=panel(`Run ${data.run} · ${a.title}`,a.href)};
  $('animation').onchange=show;show();
}
</script>
</html>
